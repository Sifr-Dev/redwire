name: CI

on:
  push:
    branches: [master, renaissance/bounded-persistence]
  pull_request:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
      - name: Fuzz RESP parser (bounded CI run)
        run: go test ./internal/resp -run '^$' -fuzz '^FuzzReadCommand$' -fuzztime=5s
